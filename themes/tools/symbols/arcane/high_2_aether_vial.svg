<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="potion-liq" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <linearGradient id="brass-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
  </defs>
  <!-- Glass Flask Body -->
  <polygon points="82,55 118,55 155,115 130,170 70,170 45,115" fill="#16222a" stroke="#64dfdf" stroke-width="4" stroke-linejoin="round"/>
  <!-- Glowing Liquid -->
  <polygon points="60,115 140,115 123,160 77,160" fill="url(#potion-liq)"/>
  <!-- Bubbles -->
  <circle cx="90" cy="140" r="5" fill="#ffffff" opacity="0.7"/>
  <circle cx="112" cy="130" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="148" r="4" fill="#ffffff" opacity="0.6"/>
  <!-- Neck & Stopper -->
  <rect x="85" y="38" width="30" height="17" fill="url(#brass-cap)" rx="3"/>
  <polygon points="88,22 112,22 108,38 92,38" fill="#5eead4"/>
  <!-- Specular Highlight -->
  <path d="M62 112 L84 65" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
